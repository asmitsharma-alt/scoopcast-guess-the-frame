<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="top-stick-clip">
      <rect x="4" y="6.8" width="24" height="5.2" rx="1.5" />
    </clipPath>
    <clipPath id="bot-stick-clip">
      <rect x="4" y="12.2" width="24" height="4.8" rx="1" />
    </clipPath>
  </defs>

  <!-- Slate Body: Scoopcast Cinema Gold -->
  <rect x="4" y="12.2" width="24" height="16" rx="3" fill="#FACC15" stroke="#111827" stroke-width="1.8"/>
  
  <!-- Slate Chalk Grid Lines -->
  <line x1="6.2" y1="19.5" x2="25.8" y2="19.5" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="19.5" x2="15" y2="26" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Scene / Take chalk marks -->
  <line x1="7.2" y1="23" x2="12.5" y2="23" stroke="#111827" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Right cinema play triangle -->
  <polygon points="18.5,21.2 18.5,25.2 22.8,23.2" fill="#111827"/>

  <!-- Fixed Bottom Stick (3 Bold White Stripes) -->
  <g clip-path="url(#bot-stick-clip)">
    <rect x="4" y="12.2" width="24" height="4.8" fill="#111827"/>
    <polygon points="7.5,12.2 11.5,12.2 8,17 4,17" fill="#FFFFFF"/>
    <polygon points="15,12.2 19,12.2 15.5,17 11.5,17" fill="#FFFFFF"/>
    <polygon points="22.5,12.2 26.5,12.2 23,17 19,17" fill="#FFFFFF"/>
  </g>
  <rect x="4" y="12.2" width="24" height="4.8" rx="1" fill="none" stroke="#111827" stroke-width="1.5"/>

  <!-- Top Clapstick (Angled Open -13 deg, 3 Bold White Stripes) -->
  <g transform="rotate(-13 5.5 12.2)">
    <g clip-path="url(#top-stick-clip)">
      <rect x="4" y="6.8" width="24" height="5.2" rx="1.5" fill="#111827"/>
      <polygon points="8.5,6.8 12.5,6.8 9,12 5,12" fill="#FFFFFF"/>
      <polygon points="16,6.8 20,6.8 16.5,12 12.5,12" fill="#FFFFFF"/>
      <polygon points="23.5,6.8 27.5,6.8 24,12 20,12" fill="#FFFFFF"/>
    </g>
    <rect x="4" y="6.8" width="24" height="5.2" rx="1.5" fill="none" stroke="#111827" stroke-width="1.5"/>
  </g>

  <!-- Metal Hinge Pin -->
  <circle cx="5.8" cy="12.5" r="1.6" fill="#111827"/>
  <circle cx="5.8" cy="12.5" r="0.7" fill="#FFFFFF"/>
</svg>