<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Online Room Pass – Guess the Frame (Exact Join Room Replica)</title>

  <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
  <link rel="preconnect" href="https://s4.anilist.co" crossorigin />

  <style>
    /* =========================================================================
       EXACT SCOOPCAST NEOBRUTALISM & CLAYMORPHISM DESIGN SYSTEM
       ========================================================================= */
    :root {
      --bg-color: #F8FAFC;
      --text-color: #121212;
      --nb-yellow: #FACC15;
      --nb-pink: #FF6B9D;
      --nb-blue: #38BDF8;
      --nb-green: #84CC16;
      --nb-orange: #FB923C;
      --nb-purple: #A855F7;
      --nb-dark: #121212;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Space Grotesk", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: #1a1a2e;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px),
        linear-gradient(135deg, #181829 0%, #0d0d1a 100%);
      background-size: 24px 24px, 100% 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      overflow-x: hidden;
      padding: 12px;
    }

    /* Modal Overlay Backdrop */
    .mp-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
    }

    /* Big Badge Menu Modal Box (Exact Desktop 80% screen dimension) */
    .mp-badge-modal-box {
      width: 80vw;
      max-width: 1180px;
      min-width: 320px;
      height: 85vh;
      max-height: 88vh;
      overflow-y: auto;
      border: 4px solid #1a1a1a;
      border-radius: 26px;
      box-shadow: 10px 10px 0 #1a1a1a;
      background: #FFFDF5;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      animation: modalPop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Badge Pass Header */
    .mp-badge-pass-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3.5px solid #1a1a1a;
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .mp-badge-pass-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #1a1a1a;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .mp-badge-pill-tag {
      background: #facc15;
      border: 2px solid #1a1a1a;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      box-shadow: 2px 2px 0 #1a1a1a;
      letter-spacing: 0.5px;
      font-family: var(--font-sans);
    }

    .mp-modal-close {
      background: #ff7eb6;
      border: 2.5px solid #1a1a1a;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 #1a1a1a;
      transition: all 0.1s ease;
      color: #1a1a1a;
    }
    .mp-modal-close:hover {
      background: #ff529a;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #1a1a1a;
    }
    .mp-modal-close:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #1a1a1a;
    }

    /* Credentials Row (Exact 3-column desktop layout: Room Code | Player Name | Character Preview) */
    .mp-credentials-row-join {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 1.3fr;
      gap: 14px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .mp-form-group {
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mp-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .mp-input {
      width: 100%;
      height: 52px;
      min-height: 52px;
      padding: 10px 14px;
      border: 3px solid #1a1a1a;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font-sans);
      background: #fff;
      color: #1a1a1a;
      outline: none;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      transition: all 0.15s ease;
    }
    .mp-input:focus {
      border-color: #1a1a1a;
      background-color: #FFFDF0;
      box-shadow: 4px 4px 0 #facc15;
    }

    .mp-code-input {
      letter-spacing: 6px;
      font-size: 22px;
      text-align: center;
      text-transform: uppercase;
      font-weight: 900;
      font-family: var(--font-mono);
      background: #fff;
    }

    /* Character Preview Badge (Inline in Credentials Row) */
    .mp-inline-preview-badge {
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      box-sizing: border-box;
      padding: 4px 12px 4px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 3px solid #1a1a1a;
      border-radius: 12px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      margin: 0;
      user-select: none;
    }

    .mp-inline-preview-badge .mp-hero-preview-frame {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 9px;
      border: 2px solid #1a1a1a;
      box-shadow: 2px 2px 0 #1a1a1a;
      padding: 1px;
      background: #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mp-hero-check-pill {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: #10b981;
      color: #000;
      font-size: 9px;
      font-weight: 900;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .mp-inline-preview-badge .mp-hero-preview-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      line-height: 1.15;
    }

    .mp-inline-preview-badge .mp-hero-char-name {
      font-size: 13px;
      font-weight: 900;
      color: #1a1a1a;
      text-transform: capitalize;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
    }

    .mp-inline-preview-badge .mp-hero-tags-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .mp-inline-preview-badge .mp-hero-cat-tag {
      font-size: 10px;
      font-weight: 800;
      background: #facc15;
      color: #1a1a1a;
      border: 1.5px solid #1a1a1a;
      border-radius: 5px;
      padding: 1px 5px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .mp-inline-preview-badge .mp-hero-format-tag {
      font-size: 9px;
      font-weight: 800;
      background: #e2e8f0;
      color: #475569;
      border: 1.5px solid #1a1a1a;
      border-radius: 5px;
      padding: 1px 4px;
      text-transform: uppercase;
    }

    /* Avatar Picker Studio Wrap */
    .mp-avatar-picker-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    /* Search & Action Bar */
    .mp-avatar-search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .mp-avatar-search-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      pointer-events: none;
      display: flex;
      align-items: center;
      color: #1a1a1a;
      font-size: 14px;
    }

    .mp-avatar-search-input {
      width: 100%;
      height: 42px;
      padding: 8px 36px 8px 38px;
      border: 2.5px solid #1a1a1a;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      box-shadow: 2px 2px 0 #1a1a1a;
      font-family: var(--font-sans);
    }
    .mp-avatar-search-input:focus {
      border-color: #1a1a1a;
      background: #FFFDF0;
      box-shadow: 3px 3px 0 #facc15;
    }

    .mp-avatar-search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mp-shuffle-btn,
    .mp-custom-upload-btn {
      height: 42px;
      padding: 0 14px;
      border: 2.5px solid #1a1a1a;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      font-family: var(--font-mono);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      box-shadow: 2.5px 2.5px 0 #1a1a1a;
      transition: all 0.1s ease;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .mp-shuffle-btn {
      background: #facc15;
      color: #1a1a1a;
    }
    .mp-shuffle-btn:hover {
      background: #eab308;
      transform: translate(-1px, -1px);
      box-shadow: 3.5px 3.5px 0 #1a1a1a;
    }
    .mp-custom-upload-btn {
      background: #f1f5f9;
      color: #1a1a1a;
    }
    .mp-custom-upload-btn:hover {
      background: #e2e8f0;
      transform: translate(-1px, -1px);
      box-shadow: 3.5px 3.5px 0 #1a1a1a;
    }
    .mp-shuffle-btn:active,
    .mp-custom-upload-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #1a1a1a;
    }

    /* Category Filter Tabs Bar (Horizontal Smooth Scroll) */
    .mp-avatar-category-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      min-height: 44px;
      height: 44px;
      padding: 2px 2px 6px 2px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #1a1a1a #F4F0EA;
    }
    .mp-avatar-category-bar::-webkit-scrollbar {
      height: 4px;
    }
    .mp-avatar-category-bar::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 4px;
    }

    .mp-category-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      min-height: 32px;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      border: 2px solid #1a1a1a;
      border-radius: 8px;
      background-color: #FFFFFF;
      color: #1a1a1a;
      box-shadow: 2px 2px 0 #1a1a1a;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .mp-category-tab:hover {
      background-color: #FEF08A;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #1a1a1a;
    }
    .mp-category-tab.active {
      background-color: #1a1a1a;
      color: #FFFFFF;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    /* 100% Square Avatar Scroll Area & Grid */
    .mp-avatar-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 3px solid #1a1a1a;
      border-radius: 14px;
      padding: 10px;
      background: #FFFFFF;
      box-shadow: inset 2px 2px 0 rgba(0,0,0,0.05);
      -webkit-overflow-scrolling: touch;
    }

    .mp-infinite-avatar-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .mp-infinite-avatar-grid { grid-template-columns: repeat(7, 1fr); }
    }
    @media (max-width: 950px) {
      .mp-infinite-avatar-grid { grid-template-columns: repeat(6, 1fr); }
    }

    /* Square Avatar Item Card */
    .mp-circular-avatar-btn {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 14px;
      border: 3px solid #1a1a1a;
      box-shadow: 3px 3px 0 #1a1a1a;
      cursor: pointer;
      padding: 2px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      outline: none;
      overflow: hidden;
    }
    .mp-circular-avatar-btn:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 4px 4px 0 #1a1a1a;
    }
    .mp-circular-avatar-btn:active {
      transform: scale(0.96);
      box-shadow: 1px 1px 0 #1a1a1a;
    }
    .mp-circular-avatar-btn.selected {
      outline: 4px solid #facc15;
      outline-offset: 1px;
      transform: scale(1.05);
      box-shadow: 5px 5px 0 #1a1a1a;
    }

    /* Fitted Image Options (contain vs cover vs portrait zoom) */
    .img-contain-fit {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
      pointer-events: none;
      display: block;
      padding: 4px;
    }
    .img-cover-zoom {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 10px;
      pointer-events: none;
      display: block;
    }
    .img-portrait-zoom {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 10px;
      pointer-events: none;
      display: block;
    }

    .mp-avatar-item-check {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: #10b981;
      color: #000;
      font-size: 10px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Infinite Loading Indicator */
    .mp-infinite-loading-indicator {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
    }

    /* Primary Action Button (ENTER ROOM →) */
    .mp-btn-primary {
      height: 54px;
      min-height: 54px;
      padding: 12px 24px;
      background: #84CC16;
      border: 3.5px solid #1a1a1a;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #1a1a1a;
      font-size: 16px;
      font-weight: 900;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      color: #1a1a1a;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      user-select: none;
    }
    .mp-btn-primary:hover {
      background: #a3e635;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #1a1a1a;
    }
    .mp-btn-primary:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #1a1a1a;
    }

    /* =========================================================================
       RESPONSIVE MOBILE ERGONOMICS (< 768px)
       Matches JoinRoomModal.jsx Mobile Flow
       ========================================================================= */
    @media (max-width: 768px) {
      body {
        padding: 0;
        align-items: flex-end;
      }

      .mp-modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .mp-badge-modal-box {
        width: 100vw !important;
        max-width: 100vw !important;
        height: auto !important;
        max-height: 94vh !important;
        border-radius: 20px 20px 0 0 !important;
        border-bottom: none !important;
        padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px)) !important;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.4) !important;
        gap: 10px !important;
      }

      .mp-badge-pass-header::before {
        content: '';
        display: block;
        width: 44px;
        height: 5px;
        background: #1a1a1a;
        border-radius: 3px;
        margin: 0 auto 10px auto;
      }

      .mp-credentials-row-join {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      .mp-mobile-avatar-trigger-card {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        background: #FFFDF0;
        border: 2.5px solid #121212;
        border-radius: 12px;
        padding: 8px 12px;
        box-shadow: 3px 3px 0 #121212;
        cursor: pointer;
        margin-top: 2px;
      }

      .mp-mobile-avatar-change-hint {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #FACC15;
        color: #121212;
        border: 2px solid #121212;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 900;
        box-shadow: 2px 2px 0 #121212;
        flex-shrink: 0;
        font-family: var(--font-mono);
      }

      /* Dedicated Mobile Avatar Selector Drawer */
      .mp-modal-box-dedicated {
        height: 92vh !important;
        max-height: 94vh !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        padding: 12px !important;
      }

      .mp-dedicated-avatar-view {
        display: flex;
        flex-direction: column;
        flex: 1;
        height: 100%;
        min-height: 0;
        gap: 8px;
        overflow: hidden;
      }

      .mp-dedicated-avatar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 2.5px solid #121212;
        flex-shrink: 0;
      }

      .mp-dedicated-title {
        font-size: 16px;
        font-weight: 900;
        font-family: var(--font-mono);
        letter-spacing: 0.5px;
        color: #121212;
      }

      .mp-back-btn,
      .mp-done-btn {
        height: 36px;
        padding: 0 12px;
        border: 2px solid #121212;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 900;
        font-family: var(--font-mono);
        cursor: pointer;
        box-shadow: 2px 2px 0 #121212;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
      }
      .mp-back-btn { background: #f1f5f9; }
      .mp-done-btn { background: #84CC16; }

      .mp-infinite-avatar-grid {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 6px !important;
      }
    }

    /* Modal for Joined Room Screen */
    .room-success-card {
      background: #FFFDF5;
      border: 4px solid #121212;
      border-radius: 20px;
      box-shadow: 8px 8px 0 #121212;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      animation: modalPop 0.2s ease-out;
    }
  </style>
</head>
<body>

  <!-- MODAL OVERLAY (Always active/visible as an exact replica) -->
  <div class="mp-modal-overlay" id="joinRoomModal">
    
    <!-- MODAL BOX -->
    <div class="mp-badge-modal-box" id="modalBox">
      
      <!-- ═══════════════════════════════════════════════════════════════
           DESKTOP & DEFAULT VIEW
           ═══════════════════════════════════════════════════════════════ -->
      <div id="standardView" style="display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 12px;">
        
        <!-- Header -->
        <div class="mp-badge-pass-header">
          <div class="mp-badge-pass-title">
            <span>🎟️ ONLINE ROOM PASS</span>
            <span class="mp-badge-pill-tag">BADGE PASS</span>
          </div>
          <button type="button" class="mp-modal-close" onclick="handleCloseClick()" aria-label="Close modal">✕</button>
        </div>

        <!-- Credentials Row: Room Code, Player Name, Character Preview -->
        <div class="mp-credentials-row-join">
          
          <!-- 1. Room Code -->
          <div class="mp-form-group">
            <label class="mp-label">4-Letter Room Code</label>
            <input
              type="text"
              id="joinCodeInput"
              class="mp-input mp-code-input"
              placeholder="FILM"
              maxlength="6"
              value=""
              autocomplete="off"
              spellcheck="false"
              oninput="this.value = this.value.toUpperCase(); playKeySound();"
            />
          </div>

          <!-- 2. Player Name -->
          <div class="mp-form-group">
            <label class="mp-label">Your Player Name</label>
            <input
              type="text"
              id="joinPlayerNameInput"
              class="mp-input font-bold"
              placeholder="Enter your name (e.g. Neo)"
              maxlength="16"
              value="Neo"
              oninput="updatePreviewName(); playKeySound();"
            />
          </div>

          <!-- 3. Character Preview Badge (Desktop view) / Trigger Card (Mobile view) -->
          <div class="mp-form-group" id="previewContainer">
            <label class="mp-label">Character Preview</label>
            
            <!-- Desktop Inline Preview Badge -->
            <div class="mp-inline-preview-badge" id="desktopPreviewBadge">
              <div class="mp-hero-preview-frame" id="heroPreviewFrame" style="background-color: #facc15;">
                <img
                  id="heroPreviewImg"
                  src="/avvtar/aman.svg"
                  alt="Aman"
                  class="img-contain-fit"
                  onerror="handleImgError(this)"
                />
                <span class="mp-hero-check-pill">✓</span>
              </div>
              <div class="mp-hero-preview-info">
                <div class="mp-hero-char-name" id="heroCharName">Aman</div>
                <div class="mp-hero-tags-row">
                  <span class="mp-hero-cat-tag" id="heroCatTag">Founders</span>
                  <span class="mp-hero-format-tag" id="heroFormatTag">SVG</span>
                </div>
              </div>
            </div>

            <!-- Mobile Trigger Card (Visible only on mobile via JS/media query) -->
            <div class="mp-mobile-avatar-trigger-card" id="mobileTriggerCard" style="display: none;" onclick="openMobileAvatarPicker()">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div class="mp-hero-preview-frame" id="mobileTriggerFrame" style="width: 38px; height: 38px; min-width: 38px; background: #facc15;">
                  <img id="mobileTriggerImg" src="/avvtar/aman.svg" alt="Aman" class="img-contain-fit" />
                </div>
                <div style="text-align: left;">
                  <div style="font-size: 13px; font-weight: 900;" id="mobileTriggerName">Aman</div>
                  <div style="font-size: 10px; color: #64748b; font-weight: 700;">Tap to change character</div>
                </div>
              </div>
              <div class="mp-mobile-avatar-change-hint">
                <span>🎨 Select</span>
                <span>→</span>
              </div>
            </div>

          </div>

        </div>

        <!-- Choose Character From All Avatars Section -->
        <div class="mp-form-group" id="avatarPickerSection" style="flex: 1; min-height: 0;">
          <label class="mp-label">Choose Character From All Avatars</label>
          
          <div class="mp-avatar-picker-wrap">
            
            <!-- Search & Actions Bar -->
            <div class="mp-avatar-search-bar">
              <div class="mp-avatar-search-input-wrap">
                <span class="search-icon">🔍</span>
                <input
                  type="text"
                  id="avatarSearchInput"
                  class="mp-avatar-search-input"
                  placeholder="Search 1,800+ avatars (e.g. 'naroto', 'gku', 'waltr', 'batmn')..."
                  oninput="handleSearchInput(this.value)"
                />
                <button
                  type="button"
                  id="searchClearBtn"
                  class="mp-avatar-search-clear"
                  style="display: none;"
                  onclick="clearSearch()"
                >✕</button>
              </div>

              <!-- Shuffle Random Mix Button -->
              <button type="button" class="mp-shuffle-btn" onclick="handleReshuffle()">
                🔀 Shuffle
              </button>

              <!-- Custom SVG/GIF Upload Button -->
              <button type="button" class="mp-custom-upload-btn" onclick="document.getElementById('fileUploadInput').click()">
                📁 Upload SVG / GIF
              </button>
              <input
                type="file"
                id="fileUploadInput"
                accept=".svg,.gif,.png,.jpg,.jpeg,.webp,image/*"
                style="display: none;"
                onchange="handleFileUpload(event)"
              />
            </div>

            <div class="mp-avatar-category-bar" id="categoryBar">
              <!-- Dynamically populated categories -->
            </div>

            <div class="mp-avatar-scroll-area" id="avatarScrollArea" onscroll="handleInfiniteScroll()">
              <div class="mp-infinite-avatar-grid" id="avatarGrid">

              </div>
              
              <div class="mp-infinite-loading-indicator" id="loadingIndicator">
                <span>⚡ Scroll for more avatars...</span>
              </div>
            </div>

          </div>
        </div>

        <button
          id="joinRoomConfirmBtn"
          class="mp-btn-primary"
          onclick="handleConfirm()"
        >
          ENTER ROOM →
        </button>

  <!-- REPLICA APPLICATION CONTROLLER -->
  <script>
    // ═══════════════════════════════════════════════════════════════
    // SOUND EFFECTS (Web Audio API Synthesizer)
    // ═══════════════════════════════════════════════════════════════
    let audioCtx = null;
    function playTone(freq, type = 'square', dur = 0.05, vol = 0.1) {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playClick() { playTone(540, 'square', 0.04, 0.08); }
    function playPop() { playTone(750, 'sine', 0.06, 0.15); }
    function playKeySound() { playTone(400 + Math.random() * 80, 'sine', 0.03, 0.04); }
    function playSuccess() {
      playTone(440, 'triangle', 0.08, 0.15);
      setTimeout(() => playTone(660, 'triangle', 0.08, 0.15), 70);
      setTimeout(() => playTone(880, 'triangle', 0.14, 0.2), 140);
    }

    // ═══════════════════════════════════════════════════════════════
    // STATE MANAGEMENT
    // ═══════════════════════════════════════════════════════════════
    const INITIAL_BATCH = 48;
    const BATCH_INCREMENT = 32;

    let selectedAvatar = AVATAR_CATALOG[0] ? AVATAR_CATALOG[0].url : 'https://res.cloudinary.com/xxvk1ruz/image/upload/v1789799893/scoopcast/avvtar/aman.svg';
    let currentCategory = 'all';
    let searchQuery = '';
    let loadedCount = INITIAL_BATCH;
    let customAvatarObj = null;
    let isMobile = window.innerWidth < 768;
    let showMobileAvatarPicker = false;
    let currentShuffledList = null;

    // ═══════════════════════════════════════════════════════════════
    // TRANSPARENCY & FIT CLASSIFICATION
    // ═══════════════════════════════════════════════════════════════
    const TRANSPARENT_CATEGORIES = new Set([
      'doraemon', 'pokemon', 'minecraft', 'dragon-ball', 'south-park',
      'spongebob', 'ben-10', 'adventure-time', 'founders', 'the-simpsons',
      'futurama', 'bobs-burgers', 'final-space', 'disney', 'overwatch', 'genshin'
    ]);

    function isAvatarTransparent(item) {
      if (!item) return false;
      if (item.isTransparent || item.isVector) return true;
      const url = item.url || '';
      if (url.includes('/avvtar/') || url.endsWith('.svg') || url.includes('dicebear.com') ||
          url.includes('showdown') || url.includes('mc-heads.net') ||
          url.includes('dragonball-api.com') || url.includes('finalspaceapi.com')) {
        return true;
      }
      if (item.category && TRANSPARENT_CATEGORIES.has(item.category)) {
        return true;
      }
      return false;
    }

    function getAvatarMeta(urlOrId) {
      if (customAvatarObj && (urlOrId === customAvatarObj.url || urlOrId === customAvatarObj.id)) {
        return customAvatarObj;
      }
      if (!urlOrId) return AVATAR_CATALOG[0];
      const clean = String(urlOrId).trim();
      const lower = clean.toLowerCase();

      let found = AVATAR_CATALOG.find(a => a.url === clean || a.id === clean);
      if (found) return found;

      found = AVATAR_CATALOG.find(a => 
        a.name.toLowerCase() === lower ||
        a.url.toLowerCase() === lower ||
        a.url.toLowerCase().endsWith('/' + lower + '.svg') ||
        a.url.toLowerCase().endsWith(lower)
      );
      if (found) return found;

      return {
        id: 'custom',
        name: 'Selected Avatar',
        category: 'custom',
        categoryLabel: 'Custom Avatar',
        url: urlOrId,
        format: clean.includes('.svg') ? 'SVG' : 'PNG',
        color: 'facc15',
        isTransparent: clean.includes('.svg') || clean.includes('/avvtar/'),
        isVector: clean.includes('.svg')
      };
    }

    // ═══════════════════════════════════════════════════════════════
    // RENDER FUNCTIONS
    // ═══════════════════════════════════════════════════════════════
    function getFilteredAvatars() {
      let list;
      const query = searchQuery.trim().toLowerCase();

      if (query) {
        list = AVATAR_CATALOG.filter(a => {
          const matchName = a.name.toLowerCase().includes(query);
          const matchCat = (a.categoryLabel || a.category || '').toLowerCase().includes(query);
          if (currentCategory !== 'all') {
            return (a.category === currentCategory) && (matchName || matchCat);
          }
          return matchName || matchCat;
        });
      } else {
        if (currentCategory === 'all') {
          if (!currentShuffledList) {
            const founders = AVATAR_CATALOG.filter(a => a.category === 'founders');
            const rest = AVATAR_CATALOG.filter(a => a.category !== 'founders');
            for (let i = rest.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [rest[i], rest[j]] = [rest[j], rest[i]];
            }
            currentShuffledList = [...founders, ...rest];
          }
          list = currentShuffledList;
        } else {
          list = AVATAR_CATALOG.filter(a => a.category === currentCategory);
        }
      }

      return list;
    }

    function renderCategoryTabs() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';

      AVATAR_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `mp-category-tab ${currentCategory === cat.id ? 'active' : ''}`;
        btn.innerText = cat.label;
        btn.onclick = (e) => {
          playClick();
          currentCategory = cat.id;
          loadedCount = INITIAL_BATCH;
          document.querySelectorAll('.mp-category-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          renderAvatarGrid();
        };
        bar.appendChild(btn);
      });
    }

    function renderAvatarGrid() {
      const grid = document.getElementById('avatarGrid');
      const filtered = getFilteredAvatars();
      const visible = filtered.slice(0, loadedCount);

      grid.innerHTML = '';

      visible.forEach((item, idx) => {
        const isSelected = selectedAvatar === item.url || (item.category === 'founders' && selectedAvatar === item.id);
        const cardBg = item.isKnownDark ? '#111827' : `#${item.color || 'ffffff'}`;
        const isCardTransparent = isAvatarTransparent(item);
        const zoomClass = isCardTransparent ? 'img-contain-fit' : (item.isKnownPortrait ? 'img-portrait-zoom' : 'img-cover-zoom');

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `mp-circular-avatar-btn ${isSelected ? 'selected' : ''}`;
        btn.style.backgroundColor = cardBg;
        btn.title = `${item.name} (${item.categoryLabel || item.category})`;
        btn.onclick = () => selectAvatar(item.url);

        btn.innerHTML = `
          <img
            src="${item.url}"
            alt="${item.name}"
            loading="lazy"
            decoding="async"
            class="${zoomClass}"
            onerror="handleImgError(this)"
          />
          ${isSelected ? '<span class="mp-avatar-item-check">✓</span>' : ''}
        `;

        grid.appendChild(btn);
      });

      const indicator = document.getElementById('loadingIndicator');
      if (visible.length >= filtered.length) {
        indicator.style.display = 'none';
      } else {
        indicator.style.display = 'flex';
      }
    }

    function selectAvatar(urlOrId) {
      playPop();
      selectedAvatar = urlOrId;
      try {
        localStorage.setItem('gtf_player_avatar', urlOrId);
      } catch (e) {}

      updatePreviewBadge();
      renderAvatarGrid(); // update checkmark

      if (isMobile && showMobileAvatarPicker) {
        closeMobileAvatarPicker();
      }
    }

    function updatePreviewBadge() {
      const meta = getAvatarMeta(selectedAvatar);
      const isTransparent = isAvatarTransparent(meta);
      const zoomClass = isTransparent ? 'img-contain-fit' : (meta.isKnownPortrait ? 'img-portrait-zoom' : 'img-cover-zoom');
      const bg = meta.isKnownDark ? '#111827' : `#${meta.color || 'facc15'}`;

      // Desktop
      const heroImg = document.getElementById('heroPreviewImg');
      const heroFrame = document.getElementById('heroPreviewFrame');
      heroImg.src = meta.url;
      heroImg.alt = meta.name;
      heroImg.className = zoomClass;
      heroFrame.style.backgroundColor = bg;

      document.getElementById('heroCharName').innerText = meta.name || 'Selected';
      document.getElementById('heroCatTag').innerText = meta.categoryLabel || meta.category || 'Character';
      document.getElementById('heroFormatTag').innerText = meta.format || 'IMG';

      // Mobile trigger
      const mobImg = document.getElementById('mobileTriggerImg');
      const mobFrame = document.getElementById('mobileTriggerFrame');
      if (mobImg) mobImg.src = meta.url;
      if (mobFrame) mobFrame.style.backgroundColor = bg;
      const mobName = document.getElementById('mobileTriggerName');
      if (mobName) mobName.innerText = meta.name || 'Selected';
    }

    function handleSearchInput(val) {
      searchQuery = val;
      loadedCount = INITIAL_BATCH;
      document.getElementById('searchClearBtn').style.display = val ? 'flex' : 'none';
      renderAvatarGrid();
    }

    function clearSearch() {
      playClick();
      searchQuery = '';
      document.getElementById('avatarSearchInput').value = '';
      document.getElementById('searchClearBtn').style.display = 'none';
      loadedCount = INITIAL_BATCH;
      renderAvatarGrid();
    }

    function handleReshuffle() {
      playClick();
      currentShuffledList = null;
      loadedCount = INITIAL_BATCH;
      const scrollArea = document.getElementById('avatarScrollArea');
      if (scrollArea) scrollArea.scrollTop = 0;
      renderAvatarGrid();
    }

    function handleInfiniteScroll() {
      const el = document.getElementById('avatarScrollArea');
      if (!el) return;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 160) {
        loadedCount += BATCH_INCREMENT;
        renderAvatarGrid();
      }
    }

    function handleFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      if (file.size > 2.5 * 1024 * 1024) {
        alert('Avatar file too large! Please choose an image under 2.5 MB.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        playSuccess();
        const dataUrl = evt.target?.result;
        customAvatarObj = {
          id: 'custom_upload_' + Date.now(),
          name: file.name.replace(/\.[^/.]+$/, '').slice(0, 16),
          category: 'custom',
          categoryLabel: 'Custom Upload',
          url: dataUrl,
          format: file.name.endsWith('.svg') ? 'SVG' : (file.name.endsWith('.gif') ? 'GIF' : 'IMG'),
          color: '38bdf8',
          isKnownDark: false,
          isKnownPortrait: false,
          isVector: file.name.endsWith('.svg'),
          isTransparent: file.name.endsWith('.svg') || file.name.endsWith('.png')
        };
        selectAvatar(dataUrl);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function handleImgError(img) {
      img.onerror = null;
      const seed = img.getAttribute('alt') || 'Hero';
      img.src = `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(seed)}&backgroundColor=facc15`;
      img.className = 'img-contain-fit';
    }

    // ═══════════════════════════════════════════════════════════════
    // MOBILE DEDICATED PICKER OVERLAY TOGGLES
    // ═══════════════════════════════════════════════════════════════
    function openMobileAvatarPicker() {
      playClick();
      showMobileAvatarPicker = true;
      const modalBox = document.getElementById('modalBox');
      const standardView = document.getElementById('standardView');
      const dedicatedMobileView = document.getElementById('dedicatedMobileView');
      const pickerSection = document.getElementById('avatarPickerSection');
      const mount = document.getElementById('dedicatedMobileMount');

      modalBox.classList.add('mp-modal-box-dedicated');
      standardView.style.display = 'none';
      dedicatedMobileView.style.display = 'flex';
      mount.appendChild(pickerSection);
      renderAvatarGrid();
    }

    function closeMobileAvatarPicker() {
      playClick();
      showMobileAvatarPicker = false;
      const modalBox = document.getElementById('modalBox');
      const standardView = document.getElementById('standardView');
      const dedicatedMobileView = document.getElementById('dedicatedMobileView');
      const pickerSection = document.getElementById('avatarPickerSection');
      const previewContainer = document.getElementById('previewContainer');

      modalBox.classList.remove('mp-modal-box-dedicated');
      dedicatedMobileView.style.display = 'none';
      standardView.style.display = 'flex';
      
      // re-insert pickerSection before Confirm button
      const confirmBtn = document.getElementById('joinRoomConfirmBtn');
      standardView.insertBefore(pickerSection, confirmBtn);
      renderAvatarGrid();
    }

    function updateResponsiveLayout() {
      isMobile = window.innerWidth < 768;
      const desktopBadge = document.getElementById('desktopPreviewBadge');
      const mobileTrigger = document.getElementById('mobileTriggerCard');
      const pickerSection = document.getElementById('avatarPickerSection');

      if (isMobile) {
        if (desktopBadge) desktopBadge.style.display = 'none';
        if (mobileTrigger) mobileTrigger.style.display = 'flex';
        if (!showMobileAvatarPicker && pickerSection) {
          pickerSection.style.display = 'none';
        }
      } else {
        if (desktopBadge) desktopBadge.style.display = 'flex';
        if (mobileTrigger) mobileTrigger.style.display = 'none';
        if (pickerSection) pickerSection.style.display = 'flex';
        if (showMobileAvatarPicker) {
          closeMobileAvatarPicker();
        }
      }
    }

    window.addEventListener('resize', updateResponsiveLayout);

    // ═══════════════════════════════════════════════════════════════
    // JOIN CONFIRMATION ACTION
    // ═══════════════════════════════════════════════════════════════
    function handleConfirm() {
      playClick();
      const codeInput = document.getElementById('joinCodeInput');
      const nameInput = document.getElementById('joinPlayerNameInput');

      const roomCode = (codeInput.value || '').trim().toUpperCase();
      const playerName = (nameInput.value || '').trim() || 'Player';

      if (!roomCode) {
        alert('Please enter a valid 4-letter room code.');
        codeInput.focus();
        return;
      }

      // Save to localStorage
      try {
        localStorage.setItem('gtf_player_name', playerName);
        localStorage.setItem('gtf_player_avatar', selectedAvatar);
        localStorage.setItem('gtf_active_session', JSON.stringify({
          roomCode,
          playerName,
          playerAvatar: selectedAvatar,
          isHost: false,
          timestamp: Date.now()
        }));
      } catch (e) {}

      // Show connecting feedback
      const confirmBtn = document.getElementById('joinRoomConfirmBtn');
      confirmBtn.innerText = '⏳ Connecting to room...';
      confirmBtn.disabled = true;

      setTimeout(() => {
        playSuccess();
        confirmBtn.innerText = 'ENTER ROOM →';
        confirmBtn.disabled = false;

        // Open Room Joined Confirmation
        document.getElementById('confirmedRoomCode').innerText = roomCode;
        document.getElementById('confirmedPlayerName').innerText = playerName;
        document.getElementById('confirmedAvatarImg').src = selectedAvatar;
        
        const meta = getAvatarMeta(selectedAvatar);
        document.getElementById('confirmedAvatarFrame').style.backgroundColor = `#${meta.color || 'facc15'}`;

        document.getElementById('roomSuccessModal').style.display = 'flex';
      }, 600);
    }

    function closeSuccessModal() {
      playClick();
      document.getElementById('roomSuccessModal').style.display = 'none';
    }

    function copyJoinedCode() {
      playClick();
      const code = document.getElementById('confirmedRoomCode').innerText;
      navigator.clipboard.writeText(code);
      alert('Room code copied: ' + code);
    }

    function copyJoinedLink() {
      playClick();
      const code = document.getElementById('confirmedRoomCode').innerText;
      const url = window.location.origin + window.location.pathname + '?room=' + code;
      navigator.clipboard.writeText(url);
      alert('Invite link copied: ' + url);
    }

    function handleCloseClick() {
      playClick();
      alert('Closed room modal. To rejoin, refresh or enter your room code.');
    }

    // ═══════════════════════════════════════════════════════════════
    // INITIAL MOUNT
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Saved player name & avatar
      try {
        const savedName = localStorage.getItem('gtf_player_name');
        if (savedName) document.getElementById('joinPlayerNameInput').value = savedName;

        const savedAvatar = localStorage.getItem('gtf_player_avatar');
        if (savedAvatar) selectedAvatar = savedAvatar;
      } catch (e) {}

      // 2. URL ?room= query param
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        document.getElementById('joinCodeInput').value = roomParam.trim().toUpperCase();
      }

      // 3. Render categories and avatar grid
      renderCategoryTabs();
      updatePreviewBadge();
      renderAvatarGrid();
      updateResponsiveLayout();
    });
  </script>
</body>
</html>
